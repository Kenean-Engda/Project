<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>To Do List</h1>

    <div class="input-area">
      <input type="text" id="taskInput" placeholder="What is your plan">
      <button id="addBtn">Add</button>
    </div>

    <div class="counter" id="counter">0 / 0 completed</div>

    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
